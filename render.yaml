services:
  - type: web
    name: job-recruitment-system
    env: docker
    dockerfilePath: ./backend/Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/jobs
    envVars:
      - key: DB_URL
        fromDatabase:
          name: ats-mysql-db
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: ats-mysql-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: ats-mysql-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"

databases:
  - name: ats-mysql-db
    databaseName: job_recruitment_db
    user: dbuser
    plan: free
    region: oregon
