services:
  - type: web
    name: job-recruitment-system
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /
    envVars:
      - key: DB_URL
        fromDatabase:
          name: ats-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"

databases:
  - name: ats-db
    databaseName: job_recruitment_db
    user: dbuser
    plan: free
    region: oregon
