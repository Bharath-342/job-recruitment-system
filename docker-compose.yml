version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: ats-mysql
    restart: always
    environment:
      MYSQL_DATABASE: job_recruitment_db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ats-backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/job_recruitment_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DB_USERNAME: root
      DB_PASSWORD: root
      SERVER_PORT: 8080
      JWT_SECRET: c2VjdXJlSldUU2VjcmV0S2V5Rm9ySm9iUmVjcnVpdG1lbnRTeXN0ZW0yMDI0VmVyeUxvbmdLZXk=
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000,http://localhost:80
    ports:
      - "8080:8080"
    volumes:
      - uploads_data:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ats-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  mysql_data:
  uploads_data:
