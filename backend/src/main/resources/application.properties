spring.application.name=job-recruitment-system

# Database
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/job_recruitment_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Bharath@1}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=${JWT_SECRET:c2VjdXJlSldUU2VjcmV0S2V5Rm9ySm9iUmVjcnVpdG1lbnRTeXN0ZW0yMDI0VmVyeUxvbmdLZXk=}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Server
server.port=${SERVER_PORT:8080}

# File Upload
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
upload.dir=${UPLOAD_DIR:./uploads}

# Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# CORS
cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

# Logging
logging.level.com.jobrecruitment=INFO
logging.level.org.springframework.security=WARN
