spring.application.name=job-recruitment-system

# Database
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/job_recruitment_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Bharath@1}

# Connection Pool (tuned for free-tier: max 5 connections)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT
jwt.secret=${JWT_SECRET:c2VjdXJlSldUU2VjcmV0S2V5Rm9ySm9iUmVjcnVpdG1lbnRTeXN0ZW0yMDI0VmVyeUxvbmdLZXk=}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Server
server.port=${PORT:${SERVER_PORT:8080}}

# File Upload
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
upload.dir=${UPLOAD_DIR:./uploads}

# Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# CORS
cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

# Job Aggregation Sync Interval (default: 6 hours = 21600000ms)
# Set lower for testing, higher to reduce load on free-tier DB
job.sync.interval=${JOB_SYNC_INTERVAL:21600000}

# Logging
logging.level.com.jobrecruitment=INFO
logging.level.org.springframework.security=WARN
logging.level.com.zaxxer.hikari=WARN
